<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DMRC Hospital Chatbot</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#f5f0e8;min-height:100vh;display:flex;flex-direction:column}

/* Header */
.header{background:linear-gradient(135deg,#8B0000 0%,#C01E1E 60%,#D42B2B 100%);padding:0 1.5rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;box-shadow:0 2px 12px rgba(139,0,0,.35);height:60px}
.header-left{display:flex;align-items:center;gap:.85rem}
.h-logo{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.h-logo img{width:28px;height:28px;object-fit:contain}
.h-title{font-size:15px;color:#fff;font-weight:700;letter-spacing:.3px}
.h-title span{color:#FFD700}
.h-sub{font-size:11px;color:rgba(255,255,255,.7);margin-top:1px}
.h-user{display:flex;align-items:center;gap:.8rem}
.h-name{font-size:12px;color:rgba(255,255,255,.85);font-weight:500}
.btn-logout{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:12px;padding:.35rem .8rem;border-radius:20px;cursor:pointer;font-family:'Inter',sans-serif;font-weight:500}
.btn-logout:hover{background:rgba(255,255,255,.25)}

/* Metro line decoration */
.metro-strip{height:6px;background:linear-gradient(90deg,#E31E24 0%,#F7941D 20%,#8DC63F 40%,#006838 60%,#0072BC 80%,#662D91 100%)}

/* Chat area */
.chat-wrap{flex:1;display:flex;flex-direction:column;max-width:780px;width:100%;margin:0 auto;padding:1.5rem 1rem;gap:1rem;overflow-y:auto;padding-bottom:175px}

/* Messages */
.msg{display:flex;gap:.75rem;animation:fadeUp .25s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg.bot{align-items:flex-start}
.msg.user{flex-direction:row-reverse}
.avatar{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.avatar.bot{background:#C01E1E;overflow:hidden;box-shadow:0 2px 8px rgba(192,30,30,.3)}
.avatar.bot img{width:24px;height:24px;object-fit:contain;filter:brightness(0) invert(1)}
.avatar.user{background:#2c3e50;color:#fff}
.bubble{max-width:85%;padding:.85rem 1.1rem;border-radius:16px;font-size:14px;line-height:1.65}
.bubble.bot{background:#fff;border:1px solid #e8ddd0;color:#2c2c2c;border-top-left-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.bubble.user{background:#C01E1E;color:#fff;border-top-right-radius:4px;box-shadow:0 2px 8px rgba(192,30,30,.3)}

/* Option buttons */
.options-grid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-top:.85rem}
.opt-btn{background:#fff;border:1.5px solid #e0d5c8;border-radius:12px;padding:.8rem 1rem;color:#2c2c2c;font-size:13px;cursor:pointer;text-align:left;transition:all .2s;font-family:'Inter',sans-serif;display:flex;align-items:center;gap:.6rem;font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.opt-btn:hover{background:#fff5f5;border-color:#C01E1E;color:#C01E1E;box-shadow:0 2px 8px rgba(192,30,30,.15)}
.opt-btn svg{width:16px;height:16px;flex-shrink:0;opacity:.6}
.opt-btn:hover svg{opacity:1}

/* Hospital cards */
.hospital-card{background:#fff;border:1px solid #e8ddd0;border-radius:12px;padding:1rem 1.1rem;margin:.4rem 0;box-shadow:0 1px 4px rgba(0,0,0,.05);border-left:3px solid #C01E1E}
.hospital-card h4{font-size:14px;font-weight:700;color:#1a1a1a;margin-bottom:.6rem}
.hc-row{display:flex;gap:.5rem;align-items:flex-start;margin:.22rem 0;font-size:12.5px}
.hc-label{color:#8a7a6a;min-width:80px;flex-shrink:0;font-weight:500}
.hc-val{color:#3c3c3c}
.tag{display:inline-block;font-size:11px;padding:2px 9px;border-radius:20px;font-weight:600;margin-right:3px}
.tag.cashless{background:#e8f5e9;color:#2e7d32;border:1px solid #a5d6a7}
.tag.checkup{background:#fff3e0;color:#e65100;border:1px solid #ffcc80}
.tag.office{background:#fff8e1;color:#f57f17;border:1px solid #ffe082}
.tag.main{background:#e3f2fd;color:#1565c0;border:1px solid #90caf9}

/* Validity badge */
.valid-badge{font-size:11px;font-weight:600;border-radius:6px;padding:.3rem .7rem;margin-top:.6rem;display:inline-flex;align-items:center;gap:4px}
.valid-badge.active{color:#2e7d32;background:#e8f5e9;border:1px solid #a5d6a7}
.valid-badge.expiring{color:#e65100;background:#fff3e0;border:1px solid #ffcc80}
.valid-badge.expired{color:#b71c1c;background:#ffebee;border:1px solid #ef9a9a}

/* PDF card */
.pdf-card{background:#fff;border:1px solid #e8ddd0;border-radius:12px;padding:1.1rem;margin-top:.5rem}
.pdf-card .pdf-title{font-size:14px;font-weight:600;color:#1a1a1a;margin-bottom:.4rem}
.pdf-card .pdf-desc{font-size:12px;color:#8a7a6a;margin-bottom:.85rem}
.pdf-btns{display:flex;gap:.5rem}
.btn-view{background:#C01E1E;color:#fff;border:none;padding:.55rem 1.1rem;border-radius:8px;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;font-weight:600}
.btn-view:hover{background:#a01818}
.btn-dl{background:#f5f0e8;color:#2c2c2c;border:1.5px solid #ddd0c0;padding:.55rem 1.1rem;border-radius:8px;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;font-weight:500}
.btn-dl:hover{background:#ede5d8}
.expired-notice{background:#ffebee;border:1px solid #ef9a9a;border-radius:10px;padding:.85rem 1rem;color:#b71c1c;font-size:13px;font-weight:500;margin-top:.5rem}

/* Result header */
.result-header{font-size:12px;font-weight:600;color:#8a7a6a;text-transform:uppercase;letter-spacing:.06em;margin-bottom:.6rem;padding-bottom:.4rem;border-bottom:1px solid #e8ddd0}
.count-badge{background:#C01E1E;color:#fff;font-size:11px;padding:2px 9px;border-radius:20px;margin-left:.5rem;font-weight:600}

/* Search row */
.search-row{display:flex;gap:.5rem;margin-top:.7rem}
.search-input{flex:1;background:#f9f5ef;border:1.5px solid #ddd0c0;border-radius:8px;padding:.6rem .9rem;color:#2c2c2c;font-size:13px;font-family:'Inter',sans-serif;outline:none}
.search-input:focus{border-color:#C01E1E;background:#fff}
.search-input::placeholder{color:#b0a090}
.btn-search{background:#C01E1E;color:#fff;border:none;border-radius:8px;padding:.6rem 1rem;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;font-weight:600}

/* Bottom bar */
.bottom-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid #e8ddd0;padding:.85rem 1rem;z-index:40;box-shadow:0 -4px 16px rgba(0,0,0,.08)}
.bottom-inner{max-width:780px;margin:0 auto}
.quick-chips{display:flex;gap:.5rem;margin-bottom:.6rem;flex-wrap:wrap}
.chip{background:#f5f0e8;border:1.5px solid #ddd0c0;border-radius:20px;padding:.3rem .85rem;color:#5a4a3a;font-size:12px;cursor:pointer;font-family:'Inter',sans-serif;font-weight:500;transition:all .15s}
.chip:hover{background:#fff5f5;border-color:#C01E1E;color:#C01E1E}
.input-row{display:flex;gap:.6rem;align-items:flex-end}
.main-input{flex:1;background:#f9f5ef;border:1.5px solid #ddd0c0;border-radius:12px;padding:.7rem 1rem;color:#2c2c2c;font-size:14px;font-family:'Inter',sans-serif;outline:none;resize:none;max-height:100px}
.main-input:focus{border-color:#C01E1E;background:#fff}
.main-input::placeholder{color:#b0a090}
.btn-send{background:#C01E1E;border:none;border-radius:10px;width:42px;height:42px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;box-shadow:0 2px 8px rgba(192,30,30,.35)}
.btn-send:hover{background:#a01818}
.btn-send svg{width:16px;height:16px;color:#fff}

/* Typing dots */
.typing{display:flex;gap:4px;padding:.3rem 0}
.dot{width:7px;height:7px;border-radius:50%;background:#C01E1E;opacity:.4;animation:bounce .8s infinite}
.dot:nth-child(2){animation-delay:.15s}
.dot:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}

/* Metro station info box */
.metro-info{background:linear-gradient(135deg,#C01E1E,#8B0000);border-radius:12px;padding:1rem 1.1rem;color:#fff;margin-top:.5rem}
.metro-info .mi-title{font-size:13px;font-weight:700;margin-bottom:.3rem;display:flex;align-items:center;gap:.4rem}
.metro-info .mi-body{font-size:12px;opacity:.9;line-height:1.6}
</style>
</head>
<body>
<span id="userName" style="display:none">{{ name }}</span>
<div class="header">
  <div class="header-left">
    <div class="h-logo"><img src="/static/dmrc-logo.png" alt="DMRC"></div>
    <div>
      <div class="h-title">DMRC <span>Hospital</span> Portal</div>
      <div class="h-sub">Employee Medical Services</div>
    </div>
  </div>
  <div class="h-user">
    <button class="btn-logout" onclick="window.location.href='/logout'">Sign out</button>
  </div>
</div>
<div class="metro-strip"></div>

<div class="chat-wrap" id="chatWrap"></div>

<div class="bottom-bar">
  <div class="bottom-inner">
    <div class="quick-chips">
      <div class="chip" onclick="sendAction('hospital_list','')">📋 Hospital List PDF</div>
      <div class="chip" onclick="promptSearch()">🔍 Search Hospital</div>
      <div class="chip" onclick="sendAction('annual_checkup','')">🏥 Annual Check-up</div>
      <div class="chip" onclick="sendAction('cashless','')">💳 Cashless Hospitals</div>
    </div>
    <div class="input-row">
      <textarea class="main-input" id="mainInput" rows="1" placeholder="Type a hospital name to search…" onkeydown="handleKey(event)"></textarea>
      <button class="btn-send" onclick="handleSend()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m22 2-11 11M22 2 15 22l-4-9-9-4Z"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
const chatWrap = document.getElementById('chatWrap');
const userName = document.getElementById('userName').textContent.trim();
let awaitingSearch = false;

function addMsg(html, role){
  const initials = userName.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2)||'ME';
  const avatarHtml = role==='bot'
    ? `<div class="avatar bot"><img src="/static/dmrc-logo.png" alt="DMRC"></div>`
    : `<div class="avatar user">${initials}</div>`;
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerHTML = `${avatarHtml}<div class="bubble ${role}">${html}</div>`;
  chatWrap.appendChild(div);
  chatWrap.scrollTop = chatWrap.scrollHeight;
  return div;
}

function showTyping(){ return addMsg('<div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>','bot'); }

function row(label, val){
  if(!val||val.trim()==='') return '';
  return `<div class="hc-row"><span class="hc-label">${label}</span><span class="hc-val">${val}</span></div>`;
}

function validityBadge(date, daysLeft){
  if(!date) return '';
  let cls = 'active', icon = '✅';
  if(daysLeft !== undefined && daysLeft !== null){
    if(daysLeft < 0){ cls='expired'; icon='❌'; }
    else if(daysLeft <= 30){ cls='expiring'; icon='⚠️'; }
  }
  const daysText = daysLeft !== undefined && daysLeft !== null
    ? (daysLeft < 0 ? ` (Expired ${Math.abs(daysLeft)} days ago)` : daysLeft <= 30 ? ` (${daysLeft} days left)` : '')
    : '';
  return `<div class="valid-badge ${cls}">${icon} Valid upto ${date}${daysText}</div>`;
}

function sendAction(action, query){
  if(query===undefined) query='';
  const typing = showTyping();
  fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,query})})
    .then(r=>r.json()).then(data=>{typing.remove();renderResponse(data);})
    .catch(()=>{typing.remove();addMsg('Something went wrong. Please try again.','bot');});
}

function renderResponse(data){

  // 1. Hospital List PDF — with auto-expiry
  if(data.type==='pdf'){
    if(data.expired){
      addMsg(`<div class="expired-notice">
        ❌ <strong>This hospital list has expired</strong> (was valid upto ${data.validity_date}).<br>
        Please contact the Admin to upload the latest hospital list.
      </div>`,'bot');
    } else {
      const daysText = data.days_left !== null
        ? (data.days_left <= 30 ? `<br><span style="color:#e65100;font-size:12px">⚠️ This list expires in ${data.days_left} days.</span>` : '')
        : '';
      addMsg(`<div class="pdf-card">
        <div class="pdf-title">📄 Consolidated Hospital List</div>
        <div class="pdf-desc">Official DMRC empanelled hospitals list${data.validity_date ? ' — valid upto <strong>'+data.validity_date+'</strong>' : ''}.${daysText}</div>
        <div class="pdf-btns">
          <button class="btn-view" onclick="window.open('/uploads/pdfs/${data.filename}','_blank')">View PDF</button>
          <a href="/uploads/pdfs/${data.filename}" download><button class="btn-dl">⬇ Download</button></a>
        </div>
      </div>`,'bot');
    }
    return;
  }

  // 2. Annual checkup / Cashless list
  if(data.type==='hospital_list'){
    const list = data.data;
    let html = `<div class="result-header">${data.title}<span class="count-badge">${list.length}</span></div>`;
    list.forEach(h=>{
      html += `<div class="hospital-card"><h4>${h.hospital_name}</h4>
        ${row('Address',h.address)}${row('Contact',h.contact_person)}${row('Phone',h.contact_number)}${row('Email',h.email)}
        ${validityBadge(data.validity_date)}</div>`;
    });
    addMsg(html,'bot'); return;
  }

  // 3. Hospital search results
  if(data.type==='hospital_details'){
    const list = data.data;
    let html = `<div class="result-header">Search Results<span class="count-badge">${list.length}</span></div>`;
    list.forEach(h=>{
      const tags = [
        h.annual_checkup==='YES'?'<span class="tag checkup">Annual Check-up</span>':'',
        h.cashless==='YES'?'<span class="tag cashless">Cashless</span>':'',
        h.source==='Office Order'?'<span class="tag office">Office Order</span>':'<span class="tag main">Consolidated List</span>',
      ].filter(Boolean).join(' ');
      const vDate = h.source==='Office Order' ? h.validity_date_src : data.validity_date;
      html += `<div class="hospital-card"><h4>${h.hospital_name}</h4>
        <div style="margin-bottom:.5rem">${tags}</div>
        ${row('Address',h.address)}
        ${h.category?row('Category',h.category):''}
        ${row('Rates',h.rates)}
        ${row('Contact',h.contact_person)}
        ${row('Phone',h.contact_number)}
        ${row('Email',h.email)}
        ${h.office_order?row('Office Order',h.office_order):''}
        ${validityBadge(vDate)}</div>`;
    });
    addMsg(html,'bot'); return;
  }

  // 4. Ask for hospital name
  if(data.type==='ask'){
    awaitingSearch = true;
    addMsg(`${data.message}<div class="search-row">
      <input class="search-input" id="inlineSearch" placeholder="e.g. Apollo Hospital" onkeydown="if(event.key==='Enter')submitInline()">
      <button class="btn-search" onclick="submitInline()">Search</button></div>`,'bot');
    setTimeout(()=>{const el=document.getElementById('inlineSearch');if(el)el.focus();},100);
    return;
  }

  if(data.message){ addMsg(data.message,'bot'); return; }
  addMsg('No results found.','bot');
}

function submitInline(){
  const el=document.getElementById('inlineSearch');
  if(!el) return;
  const q=el.value.trim();
  if(!q) return;
  addMsg(q,'user'); awaitingSearch=false; sendAction('hospital_details',q);
}

function promptSearch(){
  addMsg('Please enter the hospital name you want to search for.','bot');
  awaitingSearch=true;
  document.getElementById('mainInput').focus();
}

function handleSend(){
  const input=document.getElementById('mainInput');
  const text=input.value.trim();
  if(!text) return;
  addMsg(text,'user'); input.value='';
  if(awaitingSearch){awaitingSearch=false;sendAction('hospital_details',text);return;}
  sendAction('hospital_details',text);
}

function handleKey(e){ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();handleSend();} }

window.addEventListener('DOMContentLoaded',()=>{
  const name=userName||'there';
  // Fetch validity date from server to show in welcome
  fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'get_validity'})})
    .then(r=>r.json()).then(d=>{
      const vd = d.validity_date;
      const vBadge = vd
        ? `<div style="display:inline-flex;align-items:center;gap:6px;background:#e8f5e9;border:1px solid #a5d6a7;border-radius:8px;padding:.4rem .8rem;font-size:12px;font-weight:600;color:#2e7d32;margin-top:.6rem">
            ✅ Hospital list valid upto <strong>${vd}</strong>
           </div>`
        : `<div style="display:inline-flex;align-items:center;gap:6px;background:#fff8e1;border:1px solid #ffe082;border-radius:8px;padding:.4rem .8rem;font-size:12px;color:#f57f17;margin-top:.6rem">
            ⚠️ No validity date found — please ask admin to upload the latest hospital list
           </div>`;
      addMsg(`<div class="metro-info">
        <div class="mi-title">🚇 Welcome, <strong>${name}</strong>!</div>
        <div class="mi-body">I\'m the DMRC Hospital Assistant. I can help you find empanelled hospitals, check cashless facilities, annual health check-ups, and more.</div>
      </div>
      ${vBadge}
      <br>Choose an option below or type a hospital name:
      <div class="options-grid" style="margin-top:.85rem">
        <button class="opt-btn" onclick="sendAction('hospital_list','')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/></svg>
          Consolidated Hospital List</button>
        <button class="opt-btn" onclick="promptSearch()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          Search Hospital Details</button>
        <button class="opt-btn" onclick="sendAction('annual_checkup','')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
          Annual Health Check-up</button>
        <button class="opt-btn" onclick="sendAction('cashless','')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="20" height="14" x="2" y="5" rx="2"/><path d="M2 10h20"/></svg>
          Cashless Hospitals</button>
      </div>`,'bot');
    }).catch(()=>{
      addMsg(`<div class="metro-info">
        <div class="mi-title">🚇 Welcome, <strong>${name}</strong>!</div>
        <div class="mi-body">I\'m the DMRC Hospital Assistant.</div>
      </div>
      <br>Choose an option below or type a hospital name:
      <div class="options-grid" style="margin-top:.85rem">
        <button class="opt-btn" onclick="sendAction('hospital_list','')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/></svg>
          Consolidated Hospital List</button>
        <button class="opt-btn" onclick="promptSearch()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          Search Hospital Details</button>
        <button class="opt-btn" onclick="sendAction('annual_checkup','')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
          Annual Health Check-up</button>
        <button class="opt-btn" onclick="sendAction('cashless','')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="20" height="14" x="2" y="5" rx="2"/><path d="M2 10h20"/></svg>
          Cashless Hospitals</button>
      </div>`,'bot');
    });
});
</script>
</body>
</html>
